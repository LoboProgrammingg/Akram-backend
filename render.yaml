services:
  - type: web
    name: akram-backend
    runtime: docker
    repo: https://github.com/LoboProgrammingg/Akram-backend
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: akram-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "320"
      - key: SECRET_KEY
        sync: false
      - key: TIMEZONE
        value: America/Cuiaba
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: EXPORT_DIR
        value: ./data/exports
      - key: PORT
        value: "8000"

databases:
  - name: akram-db
    plan: free
    databaseName: akram_db
    postgresMajorVersion: "16"
